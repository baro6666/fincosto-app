name: Fincosto
options:
  bundleIdPrefix: com.fincosto
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: Y7UHFYN396
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Fincosto:
    type: application
    platform: iOS
    sources: [Fincosto]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fincosto.app
        PRODUCT_NAME: fincosto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Fincosto/Info.plist
schemes:
  Fincosto:
    build:
      targets:
        Fincosto: all
    archive:
      config: Release
