# iPhone uygulamasını GitHub'ın Mac sunucusunda derler, imzalar ve TestFlight'a yükler.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API anahtarı, Admin; .p8 dosyasının içeriği)
# İmza: sertifika adında 'ç' olduğundan Xcode'un ada göre ürettiği imza şartı Apple'dan geçmiyor (90035).
# Bu yüzden her derlemede geçici dağıtım sertifikası + profil (ios/asc.py) oluşturulur, imza şartı Team ID'ye
# göre yazılır, iş bitince sertifika iptal edilir (mağaza / TestFlight sürümlerini etkilemez).
name: iOS → TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios
  cancel-in-progress: false

env:
  BUNDLE_ID: com.fincosto.app
  TEAM_ID: Y7UHFYN396

jobs:
  derle:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Sırlar tanımlı mı
        id: sir
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 sırları henüz tanımlı değil; derleme atlandı."
            echo "var=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "var=1" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Xcode projesini üret
        if: steps.sir.outputs.var == '1'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Geçici sertifika ve profil
        if: steps.sir.outputs.var == '1'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q pyjwt cryptography
          S="$RUNNER_TEMP/imza"; mkdir -p "$S"
          openssl genrsa -out "$S/anahtar.pem" 2048 2>/dev/null
          openssl req -new -key "$S/anahtar.pem" -subj "/CN=fincosto CI" -out "$S/csr.pem"
          "$RUNNER_TEMP/py/bin/python" ios/asc.py hazirla "$S/csr.pem" "$S"
          # Anahtarlık
          KC="$RUNNER_TEMP/ci.keychain-db"; echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          curl -sSfL -o "$S/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$S/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          openssl x509 -inform DER -in "$S/sertifika.cer" -out "$S/sertifika.pem"
          openssl pkcs12 -export -inkey "$S/anahtar.pem" -in "$S/sertifika.pem" -out "$S/imza.p12" -passout pass:ci 2>/dev/null \
            || openssl pkcs12 -export -legacy -inkey "$S/anahtar.pem" -in "$S/sertifika.pem" -out "$S/imza.p12" -passout pass:ci
          security import "$S/imza.p12" -k "$KC" -P ci -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          SHA1=$(openssl x509 -in "$S/sertifika.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)
          echo "IMZA_SHA1=$SHA1" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"
          # Profil
          UUID=$(python3 -c "import json;print(json.load(open('$S/kimlikler.json'))['profilUuid'])")
          AD=$(python3 -c "import json;print(json.load(open('$S/kimlikler.json'))['profilAdi'])")
          for D in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$D"; cp "$S/profil.mobileprovision" "$D/$UUID.mobileprovision"; done
          echo "PROFIL_ADI=$AD" >> "$GITHUB_ENV"
          # İmza şartı: ada değil Team ID'ye göre
          printf 'designated => anchor apple generic and identifier "%s" and certificate leaf[subject.OU] = "%s"\n' "$BUNDLE_ID" "$TEAM_ID" > "$S/sart.txt"
          csreq -r "$S/sart.txt" -b "$S/sart.bin"
          echo "SART=$S/sart.bin" >> "$GITHUB_ENV"

      - name: Arşivle (imzala)
        if: steps.sir.outputs.var == '1'
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Fincosto.xcodeproj -scheme Fincosto -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Fincosto.xcarchive" \
            CURRENT_PROJECT_VERSION=$((100 + GITHUB_RUN_NUMBER)) \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="$IMZA_SHA1" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFIL_ADI" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC --requirements $SART" \
            archive | tail -n 60

      - name: Paketle ve imzayı doğrula
        if: steps.sir.outputs.var == '1'
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/paket"; rm -rf "$P"; mkdir -p "$P/Payload"
          cp -R "$RUNNER_TEMP/Fincosto.xcarchive/Products/Applications/"*.app "$P/Payload/"
          APP=$(ls -d "$P"/Payload/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier=' || true
          codesign -d -r- "$APP" 2>&1 | tail -1
          codesign -d --entitlements - "$APP" 2>&1 | grep -A1 -E 'get-task-allow|beta-reports' || true
          codesign --verify --deep --strict --verbose=2 "$APP"
          (cd "$P" && zip -qry fincosto.ipa Payload)
          echo "IPA=$P/fincosto.ipa" >> "$GITHUB_ENV"

      - name: TestFlight'a yükle
        if: steps.sir.outputs.var == '1'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal

      - name: Temizlik (sertifikayı iptal et, anahtarları sil)
        if: always() && steps.sir.outputs.var == '1'
        run: |
          [ -x "$RUNNER_TEMP/py/bin/python" ] && "$RUNNER_TEMP/py/bin/python" ios/asc.py temizle "$RUNNER_TEMP/imza" || true
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/imza" ~/.appstoreconnect
