# iPhone uygulamasını GitHub'ın Mac sunucusunda derler ve TestFlight'a yükler.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API anahtarı, .p8 dosyasının içeriği)
name: iOS → TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  derle:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Sırlar tanımlı mı
        id: sir
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 sırları henüz tanımlı değil; derleme atlandı."
            echo "var=0" >> "$GITHUB_OUTPUT"
          else
            echo "var=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Xcode projesini üret
        if: steps.sir.outputs.var == '1'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Arşivle (imzala)
        if: steps.sir.outputs.var == '1'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          set -o pipefail
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/asc/AuthKey.p8"
          head -1 "$RUNNER_TEMP/asc/AuthKey.p8" | grep -q 'BEGIN PRIVATE KEY' || echo "::error::ASC_KEY_P8 '-----BEGIN PRIVATE KEY-----' satırıyla başlamıyor."
          echo "Key ID uzunluğu: ${#ASC_KEY_ID} (10 olmalı) · Issuer ID uzunluğu: ${#ASC_ISSUER_ID} (36 olmalı)"
          cd ios
          xcodebuild -project Fincosto.xcodeproj -scheme Fincosto -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Fincosto.xcarchive" \
            CURRENT_PROJECT_VERSION=$((100 + GITHUB_RUN_NUMBER)) \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 80

      - name: Dışa aktar (App Store imzası)
        if: steps.sir.outputs.var == '1'
        run: |
          cd ios
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Fincosto.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/cikti" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/cikti"

      - name: İmzayı incele
        if: steps.sir.outputs.var == '1'
        run: |
          cd "$RUNNER_TEMP" && rm -rf ipa && mkdir ipa && cd ipa && unzip -q ../cikti/*.ipa
          APP=$(ls -d Payload/*.app)
          codesign -dvvv "$APP" 2>&1 | grep -v '^CDHash\|Hash=' || true
          echo "--- yetkiler"; codesign -d --entitlements - "$APP" 2>&1 | head -40 || true
          echo "--- doğrulama"; codesign --verify --deep --strict --verbose=4 "$APP" 2>&1 || true
          echo "--- gereksinim"; codesign -d -r- "$APP" 2>&1 || true
          echo "--- profil"; security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | grep -A1 -E 'ProvisionsAllDevices|get-task-allow' || true
          ls -la "$APP"

      - name: TestFlight'a yükle
        if: steps.sir.outputs.var == '1'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/asc/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f "$(ls $RUNNER_TEMP/cikti/*.ipa)" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          rm -rf ~/.appstoreconnect

      - name: Dağıtım kaydı (hata olursa)
        if: failure()
        run: |
          for f in $(ls -d /var/folders/*/*/T/*.xcdistributionlogs 2>/dev/null); do
            echo "== $f"; tail -n 120 "$f/IDEDistribution.standard.log" 2>/dev/null | grep -iv 'token\|authorization\|bearer' || true
          done

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
